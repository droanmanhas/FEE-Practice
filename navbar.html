```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeVerse Login</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background-color: #20232a;
            min-height: 100vh;
        }


        /* NAVBAR */

        nav {
            height: 70px;
            background-color: #61dafb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #20232a;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #20232a;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: white;
        }


        /* NOTIFICATION */

        .notification {
            position: relative;
            font-size: 22px;
            color: #20232a;
        }

        .notification span {
            position: absolute;
            top: -9px;
            right: -10px;

            background-color: red;
            color: white;

            width: 17px;
            height: 17px;

            border-radius: 50%;
            font-size: 10px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* LOGIN AREA */

        .container {
            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .login-box {
            width: 360px;
            background-color: #ffffff;

            padding: 35px;

            border-radius: 8px;

            box-shadow: 0 5px 15px black;
        }


        .login-box h1 {
            text-align: center;
            color: #20232a;

            margin-bottom: 25px;
        }


        /* INPUT */

        .input-box {
            margin-bottom: 20px;
            position: relative;
        }

        .input-box input {
            width: 100%;

            padding: 13px;

            border: 1px solid gray;
            border-radius: 5px;

            font-size: 15px;

            outline: none;
        }

        .input-box input:focus {
            border: 2px solid #61dafb;
        }

        .input-box i {
            position: absolute;

            right: 14px;
            top: 14px;

            color: gray;
        }


        /* OPTIONS */

        .options {
            display: flex;
            justify-content: space-between;

            font-size: 13px;

            margin-bottom: 22px;
        }

        .options a {
            color: #087ea4;
            text-decoration: none;
        }


        /* BUTTON */

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 5px;

            background-color: #087ea4;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background-color: #055c78;
        }


        /* REGISTER */

        .register {
            text-align: center;

            margin-top: 20px;

            color: #555;
        }

        .register a {
            color: #087ea4;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <!-- NAVIGATION BAR -->

    <nav>

        <div class="logo">
            CodeVerse
        </div>


        <ul>

            <li>
                <a href="#">HOME</a>
            </li>

            <li>
                <a href="#">ABOUT</a>
            </li>

            <li>
                <a href="#">CONTACT</a>
            </li>

        </ul>


        <div class="notification">

            <i class="fa-solid fa-bell"></i>

            <span>5</span>

        </div>

    </nav>



    <!-- LOGIN SECTION -->

    <div class="container">


        <div class="login-box">

            <h1>Login</h1>


            <form>


                <!-- USERNAME -->

                <div class="input-box">

                    <input
                    type="text"
                    placeholder="Enter Username">

                    <i class="fa-solid fa-user"></i>

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <input
                    type="password"
                    placeholder="Enter Password">

                    <i class="fa-solid fa-lock"></i>

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit">
                    LOGIN
                </button>


                <!-- REGISTER -->

                <div class="register">

                    <p>
                        Don't have an account?
                        <a href="#">Register</a>
                    </p>

                </div>


            </form>

        </div>

    </div>


</body>

</html>
```
